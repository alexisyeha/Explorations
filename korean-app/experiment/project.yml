name: PageFlipPrototype
options:
  bundleIdPrefix: com.alexchung.pageflip
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PageFlipPrototype:
    type: application
    platform: iOS
    sources:
      - path: PageFlipPrototype
    info:
      path: PageFlipPrototype/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexchung.pageflip
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
