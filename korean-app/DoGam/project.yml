name: DoGam
options:
  bundleIdPrefix: com.alexchung.dogam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  DEVELOPMENT_TEAM: "2VBQV3F3JH"
  CODE_SIGN_STYLE: Automatic
targets:
  DoGam:
    type: application
    platform: iOS
    sources:
      - path: DoGam
    resources:
      - path: DoGam/Assets.xcassets
      - path: DoGam/Resources
    info:
      path: DoGam/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSpeechRecognitionUsageDescription: "도감 uses speech recognition to listen to you read Korean words and sentences aloud."
        NSMicrophoneUsageDescription: "도감 uses the microphone to hear you read Korean text aloud in voice mode."
        UIAppFonts:
          - SejongGeulggot.otf
          - TAYBirdie.otf
          - TAYBigBird.otf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexchung.dogam
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
